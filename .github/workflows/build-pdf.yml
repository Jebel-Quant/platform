name: Build PDF

on:
  push:
    branches:
      - LaTeX
    paths:
      - vision.tex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            fonts-texgyre \
            ghostscript

      - name: Compile vision.tex (first pass)
        run: xelatex -interaction=nonstopmode vision.tex

      - name: Compile vision.tex (second pass for cross-references)
        run: xelatex -interaction=nonstopmode vision.tex

      - name: Create output directory
        run: mkdir -p _pdf

      - name: Strip PDF restrictions with Ghostscript
        run: |
          gs -dBATCH -dNOPAUSE -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.4 \
            -sOutputFile=_pdf/vision.pdf \
            vision.pdf

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _pdf
          keep_files: true
          commit_message: "Update vision.pdf"
