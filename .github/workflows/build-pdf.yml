name: Build vision.pdf

on:
  push:
    branches:
      - main
    paths:
      - vision.md
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            fonts-texgyre

      - name: Install ghostscript
        run: sudo apt-get install -y ghostscript

      - name: Compile vision.md to vision.pdf
        run: |
          mkdir -p _pdf
          pandoc vision.md -o _pdf/vision.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=2.5cm \
            -V fontsize=11pt \
            -V linestretch=1.4 \
            -V mainfont="TeX Gyre Termes" \
            -V linkcolor=blue
          gs -dBATCH -dNOPAUSE -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.4 \
            -sOutputFile=_pdf/vision_clean.pdf \
            _pdf/vision.pdf \
            && mv _pdf/vision_clean.pdf _pdf/vision.pdf

      - name: Deploy PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_pdf
          keep_files: true
          commit_message: "Update vision.pdf"
