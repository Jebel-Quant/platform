name: Build PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra

      - name: Compile vision.tex (first pass)
        run: xelatex -interaction=nonstopmode vision.tex

      - name: Copy PDF to output directory
        run: mkdir -p _pdf && cp vision.pdf _pdf/vision.pdf

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _pdf
          keep_files: true
          commit_message: "Update vision.pdf"
